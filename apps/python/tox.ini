[tox]
envlist = test,lint,type
skipsdist = true

[testenv:test]
deps =
    pytest
    pytest-cov
commands =
    pytest --cov=algorithm --cov-report=term-missing --verbose

[testenv:lint]
deps = ruff
commands =
    ruff check .
    ruff format --check .

[testenv:format]
deps = ruff
commands =
    ruff format .

[testenv:type]
deps =
    mypy
    pytest
commands =
    mypy src/algorithm tests

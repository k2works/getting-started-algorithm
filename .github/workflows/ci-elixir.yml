name: CI - Elixir

on:
  push:
    paths:
      - 'apps/elixir/**'
  pull_request:
    paths:
      - 'apps/elixir/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.18'
          otp-version: '27'
      - name: Install dependencies
        working-directory: apps/elixir
        run: mix deps.get
      - name: Run tests
        working-directory: apps/elixir
        run: mix test
